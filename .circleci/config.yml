version: 2.1

commands:
  check-if-tests-needed:
    steps:
      - run:
          name: Check if tests need to run
          command: |
            # If we're on main branch, always run tests
            if [ "${CIRCLE_BRANCH}" = "main" ]; then
              echo "On main branch - running all tests"
              exit 0
            fi
            
            # Fetch all the branches
            git fetch origin
            
            # Get list of changed files between current branch and main
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
            
            # Check if any relevant files changed
            echo "$CHANGED_FILES" | grep -q -E "^(src/|tests/|tests_autowrapt/|tests_aws/|.circleci/|pyproject.toml)" || {
              echo "No changes in src/, tests/, tests_autowrapt/, tests_aws/, .circleci directories or pyproject.toml file. Skipping tests."
              circleci step halt
            }

  pip-install-deps:
    steps:
      - run:
          name: Install Python Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install 'wheel==0.45.1'
            pip install -r requirements.txt

  pip-install-tests-deps:
    parameters:
      requirements:
        default: "tests/requirements.txt"
        type: string
    steps:
      - run:
          name: Install Python Tests Dependencies
          command: |
            . venv/bin/activate
            pip install -r <<parameters.requirements>>
      - run:
          name: Apply grace period to installed packages
          command: |
            . venv/bin/activate
            pip install --quiet requests packaging pip-audit
            python .circleci/pin_safe_versions.py <<parameters.requirements>>

  run-tests-with-coverage-report:
    parameters:
      cassandra:
        default: ""
        type: string
      gevent:
        default: ""
        type: string
      kafka:
        default: ""
        type: string
      tests:
        default: "tests"
        type: string
    steps:
      - run:
          name: Run Tests With Coverage Report
          environment:
            CASSANDRA_TEST: "<<parameters.cassandra>>"
            GEVENT_TEST: "<<parameters.gevent>>"
            KAFKA_TEST: "<<parameters.kafka>>"
          command: |
            . venv/bin/activate
            # Capture pytest exit code explicitly. This step intentionally does NOT
            # fail the job, so that coverage, workspace and artifact steps that
            # follow always run. The job is failed at the very end by the
            # fail-if-tests-failed command, which reads this exit code.
            set +e
            coverage run --source=instana -m pytest -v --junitxml=test-results <<parameters.tests>> 2>&1 | tee /tmp/pytest_output.txt
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            # Write to a fixed location; capture-installed-versions and
            # fail-if-tests-failed read it.
            echo $TEST_EXIT_CODE > /tmp/pytest_exit_code.txt
            echo "pytest exit code: $TEST_EXIT_CODE"
            # Extract failed test module names for package-level status tracking.
            # e.g. "FAILED tests/frameworks/test_fastapi.py::..." → "fastapi"
            grep "^FAILED tests/" /tmp/pytest_output.txt \
              | sed 's|FAILED tests/[^/]*/test_\([^.:]*\).*|\1|' \
              | sort -u > /tmp/pytest_failed_tests.txt || true
            echo "Failed test modules: $(cat /tmp/pytest_failed_tests.txt | tr '\n' ' ')"
            coverage report -m
            coverage html
            mkdir -p coverage_results
            cp -R .coverage coverage_results/.coverage.${CIRCLE_BUILD_NUM}
            exit 0
      - persist_to_workspace:
          root: .
          paths:
            - coverage_results

  capture-installed-versions:
    parameters:
      label:
        type: string
    steps:
      - run:
          name: Capture installed package versions
          when: always
          command: |
            . venv/bin/activate
            pip freeze > /tmp/installed_<<parameters.label>>.txt
      - run:
          name: Capture test exit code and failed modules
          when: always
          command: |
            # Persist this job's pytest exit code so update-currency-versions
            # can assemble a single test-status.json from all jobs.
            # Exit code file was written by run-tests-with-coverage-report.
            if [ -f /tmp/pytest_exit_code.txt ]; then
              cp /tmp/pytest_exit_code.txt /tmp/pytest_exit_<<parameters.label>>.txt
            else
              echo "1" > /tmp/pytest_exit_<<parameters.label>>.txt
            fi
            # Persist the list of failed test module names (may be empty).
            if [ -f /tmp/pytest_failed_tests.txt ]; then
              cp /tmp/pytest_failed_tests.txt /tmp/pytest_failed_<<parameters.label>>.txt
            else
              touch /tmp/pytest_failed_<<parameters.label>>.txt
            fi
      - persist_to_workspace:
          root: /tmp
          paths:
            - installed_<<parameters.label>>.txt
            - pytest_exit_<<parameters.label>>.txt
            - pytest_failed_<<parameters.label>>.txt

  fail-if-tests-failed:
    steps:
      - run:
          name: Fail job if tests failed
          when: always
          command: |
            # Must be the LAST step of every test job: all artifacts, test results
            # and workspace files have been saved by now.
            CODE=$(cat /tmp/pytest_exit_code.txt 2>/dev/null | tr -d '[:space:]')
            [ -z "$CODE" ] && CODE=1
            # Print short summary if tests failed, so it is visible in the job log
            # without scrolling through the full verbose output.
            if [ "$CODE" != "0" ] && [ -f /tmp/pytest_output.txt ]; then
              echo ""
              sed -n '/=* short test summary info =*/,/^=\{3\}/p' /tmp/pytest_output.txt || true
            fi
            echo "pytest exit code: $CODE"
            exit $CODE

  store-pytest-results:
    steps:
      - store_test_results:
          path: test-results
  
  run_sonarqube:
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run SonarQube to report the coverage
          command: |
            python -m venv venv
            . venv/bin/activate
            
            pip install --upgrade pip coverage
            coverage combine ./coverage_results
            coverage xml -i

            PR_NUMBER=$(echo ${CIRCLE_PULL_REQUEST} | sed 's/.*\///')
            SONAR_TOKEN=${SONAR_TOKEN}

            pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pysonar-scanner
            export SONAR_SCANNER_OPTS="-server"
            
            if [[ -n "${PR_NUMBER}" ]]; then
              pysonar-scanner \
                -Dsonar.organization=instana \
                -Dsonar.projectKey=instana_python-sensor \
                -Dsonar.host.url="${SONARQUBE_URL}" \
                -Dsonar.pullrequest.key="${PR_NUMBER}" \
                -Dsonar.pullrequest.branch="${CIRCLE_BRANCH}"
            else
              pysonar-scanner \
                -Dsonar.organization=instana \
                -Dsonar.projectKey=instana_python-sensor \
                -Dsonar.host.url="${SONARQUBE_URL}" \
                -Dsonar.branch.name="${CIRCLE_BRANCH}"
            fi
      - store_artifacts:
          path: htmlcov

  store-coverage-report:
    steps:
      - store_artifacts:
          path: htmlcov

jobs:
  python3x:
    parameters:
      py-version:
        type: string
    docker:
      - image: public.ecr.aws/docker/library/python:<<parameters.py-version>>
      - image: public.ecr.aws/docker/library/postgres:16.10-trixie
        environment:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: passw0rd
          POSTGRES_DB: instana_test_db
      - image: public.ecr.aws/docker/library/mariadb:11.3.2
        environment:
          MYSQL_ROOT_PASSWORD: passw0rd
          MYSQL_DATABASE: instana_test_db
      - image: public.ecr.aws/docker/library/redis:7.2.4-bookworm
      - image: public.ecr.aws/docker/library/rabbitmq:3.13.0
      - image: public.ecr.aws/docker/library/mongo:7.0.6
      - image: quay.io/thekevjames/gcloud-pubsub-emulator:latest
        environment:
          PUBSUB_EMULATOR_HOST: 0.0.0.0:8681
          PUBSUB_PROJECT1: test-project,test-topic
      - image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
        environment:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      - image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrong@Passw0rd
          MSSQL_USER: sa
          MSSQL_DATABASE: master
    working_directory: ~/repo
    steps:
      - checkout
      - check-if-tests-needed
      - pip-install-deps
      - pip-install-tests-deps
      - run-tests-with-coverage-report
      - capture-installed-versions:
          label: "py<<parameters.py-version>>"
      - store-pytest-results
      - store-coverage-report
      - fail-if-tests-failed

  py39gevent:
    docker:
      - image: public.ecr.aws/docker/library/python:3.9
    working_directory: ~/repo
    steps:
      - checkout
      - check-if-tests-needed
      - pip-install-deps
      - pip-install-tests-deps:
          requirements: "tests/requirements-gevent-starlette.txt"
      - run-tests-with-coverage-report:
          gevent: "true"
          tests: "tests/frameworks/test_gevent.py"
      - capture-installed-versions:
          label: "gevent"
      - store-pytest-results
      - store-coverage-report
      - fail-if-tests-failed

  py312aws:
    docker:
      - image: public.ecr.aws/docker/library/python:3.12
    working_directory: ~/repo
    steps:
      - checkout
      - check-if-tests-needed
      - pip-install-deps
      - pip-install-tests-deps:
          requirements: "tests/requirements-aws.txt"
      - run-tests-with-coverage-report:
          tests: "tests_aws"
      - capture-installed-versions:
          label: "aws"
      - store-pytest-results
      - store-coverage-report
      - fail-if-tests-failed

  py312cassandra:
    docker:
      - image: public.ecr.aws/docker/library/python:3.12
      - image: public.ecr.aws/docker/library/cassandra:3.11.16-jammy
        environment:
          MAX_HEAP_SIZE: 2048m
          HEAP_NEWSIZE: 512m
    working_directory: ~/repo
    steps:
      - checkout
      - check-if-tests-needed
      - pip-install-deps
      - pip-install-tests-deps:
          requirements: "tests/requirements-cassandra.txt"
      - run-tests-with-coverage-report:
          cassandra: "true"
          tests: "tests/clients/test_cassandra-driver.py"
      - capture-installed-versions:
          label: "cassandra"
      - store-pytest-results
      - store-coverage-report
      - fail-if-tests-failed

  pykafka:
    parameters:
      py-version:
        type: string
    docker:
      - image: public.ecr.aws/docker/library/python:<<parameters.py-version>>
      - image: public.ecr.aws/ubuntu/zookeeper:3.1-22.04_edge
        environment:
          TZ: UTC
      - image: public.ecr.aws/ubuntu/kafka:3.1-22.04_edge
        environment:
          TZ: UTC
          ZOOKEEPER_HOST: localhost
          ZOOKEEPER_PORT: 2181
        command:
          - /opt/kafka/config/server.properties
          - --override
          - listeners=INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
          - --override
          - advertised.listeners=INTERNAL://localhost:9093,EXTERNAL://localhost:9094
          - --override
          - listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
          - --override
          - inter.broker.listener.name=INTERNAL
          - --override
          - broker.id=1
          - --override
          - offsets.topic.replication.factor=1
          - --override
          - transaction.state.log.replication.factor=1
          - --override
          - transaction.state.log.min.isr=1
          - --override
          - auto.create.topics.enable=true
    working_directory: ~/repo
    steps:
      - checkout
      - check-if-tests-needed
      - pip-install-deps
      - pip-install-tests-deps:
          requirements: "tests/requirements-kafka.txt"
      - run-tests-with-coverage-report:
          kafka: "true"
          tests: "tests/clients/kafka/test*.py"
      - capture-installed-versions:
          label: "kafka-<<parameters.py-version>>"
      - store-pytest-results
      - store-coverage-report
      - fail-if-tests-failed

  autowrapt:
    parameters:
      py-version:
        type: string
    docker:
      - image: public.ecr.aws/docker/library/python:<<parameters.py-version>>
        environment:
          AUTOWRAPT_BOOTSTRAP: instana
    working_directory: ~/repo
    steps:
      - checkout
      - check-if-tests-needed
      - pip-install-deps
      - pip-install-tests-deps:
          requirements: "tests/requirements-minimal.txt"
      - run-tests-with-coverage-report:
          tests: "tests_autowrapt"
      - capture-installed-versions:
          label: "autowrapt-<<parameters.py-version>>"
      - store-pytest-results
      - store-coverage-report
      - fail-if-tests-failed

  final_job:
    docker:
      - image: public.ecr.aws/docker/library/python:3.13
    working_directory: ~/repo
    steps:
      - checkout
      - check-if-tests-needed
      - run_sonarqube

  update-currency-versions:
    docker:
      - image: public.ecr.aws/docker/library/alpine:latest
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Collect pip freeze files and build test-status.json
          command: |
            mkdir -p /tmp/pip-freeze

            cp /tmp/workspace/installed_*.txt /tmp/pip-freeze/ 2>/dev/null || echo "No installed_*.txt files found"

            # Build a package-level test-status.json.
            # Format: { "fastapi": "fail", "sqlalchemy": "pass", ... }
            #
            # A package is marked "fail" if its test module name appears in ANY
            # pytest_failed_<label>.txt file across all CI jobs.
            # All other packages are implicitly "pass" (absent from the JSON).

            # Collect every unique failed module name from all jobs.
            FAILED_MODULES_FILE=/tmp/all_failed_modules.txt
            > "$FAILED_MODULES_FILE"
            for FAILED_FILE in /tmp/workspace/pytest_failed_*.txt; do
              [ -f "$FAILED_FILE" ] || continue
              cat "$FAILED_FILE" >> "$FAILED_MODULES_FILE"
            done
            sort -u "$FAILED_MODULES_FILE" -o "$FAILED_MODULES_FILE"

            echo "All failed test modules:"
            cat "$FAILED_MODULES_FILE"
            echo ""

            # Build JSON: one key per failed module → "fail".
            # Absent keys mean "pass" (handled in merge_versions.py).
            JSON="{"
            FIRST=1
            while IFS= read -r MODULE; do
              [ -z "$MODULE" ] && continue
              [ $FIRST -eq 0 ] && JSON="${JSON},"
              JSON="${JSON} \"${MODULE}\": \"fail\""
              FIRST=0
            done < "$FAILED_MODULES_FILE"
            JSON="${JSON} }"
            echo "$JSON" > /tmp/pip-freeze/test-status.json

            echo "test-status.json:"
            cat /tmp/pip-freeze/test-status.json
            echo ""
            ls -la /tmp/pip-freeze/
      - store_artifacts:
          path: /tmp/pip-freeze
          destination: pip-freeze

workflows:
  tests:
    max_auto_reruns: 2
    jobs:
      - python3x:
          matrix:
            parameters:
              py-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
      - py39gevent
      - py312aws
      - py312cassandra
      - pykafka:
          matrix:
            parameters:
              py-version: ["3.9", "3.12", "3.14"]
      - autowrapt:
          matrix:
            parameters:
              py-version: ["3.11", "3.12", "3.13", "3.14"]
      - final_job:
          # Run SonarQube even if some test jobs failed, so coverage is always reported.
          requires:
            - python3x: terminal
            - py39gevent: terminal
            - py312aws: terminal
            - py312cassandra: terminal
            - pykafka: terminal
            - autowrapt: terminal
      - update-currency-versions:
          filters:
            branches:
              only:
                - main
          # `terminal` = run after the required jobs finish, whether they
          # succeeded, failed or were canceled.
          requires:
            - python3x: terminal
            - py39gevent: terminal
            - py312aws: terminal
            - py312cassandra: terminal
            - pykafka: terminal
            - autowrapt: terminal