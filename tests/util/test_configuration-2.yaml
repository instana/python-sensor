# service-level configuration, aligning with in-code settings
com.instana.tracing:
  global:
    # Default is always false (Server-Timing header is injected); set to true here to test disabling it
    disable-server-timing: true
  filter:
    exclude:
      - name: "Redis"
        attributes:
          - key: "command"
            values: ["get"]
          - key: "get"
            values: ["type"]
      - name: "DynamoDB"
        attributes:
          - key: "op"
            values: ["query"]
      - name: "Kafka"
        attributes:
          - key: "kafka.access"
            values: ["consume", "send", "produce"]
            match_type: "contains"
          - key: "kafka.service"
            values: ["span-topic", "topic1", "topic2"]
            match_type: "strict"
          - key: "kafka.access"
            values: ["*"]
  http:
    exit:
      classify-all-4xx-as-errors: true
  disable:
    - "logging": true
    - "databases": true
    - "redis": false
